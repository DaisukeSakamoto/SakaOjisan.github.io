<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>埋め込みページのサンプル</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }
        /* 動画をレスポンシブ（画面サイズに合わせて伸縮）にするためのスタイル */
        .embed-container {
            position: relative;
            padding-bottom: 56.25%; /* アスペクト比 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 800px; /* 最大幅を制限 */
            margin-top: 20px;
        }
        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none; /* 枠線を消す */
        }
    </style>
</head>
<body>

    <h1>オープンプロセッシング埋め込んだ</h1>
    

    <div class="embed-container">
<iframe src="https://openprocessing.org/sketch/2955783/embed/" width="400" height="400"></iframe>
    </div>

    <hr>


</body>
</html>
